<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Celebration</title>
    <style>
        body {
            background-color: #110826;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 35px;
            text-shadow: 0 0 10px #ff3366;
        }

        /* كعكة عيد الميلاد بتصميم واقعي ومنحني */
        .cake-container {
            position: relative;
            width: 220px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flame {
            width: 14px;
            height: 22px;
            background: #ffcc00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ffcc00, 0 0 20px #ff6600;
            animation: burn 0.7s infinite alternate ease-in-out;
            margin-bottom: 2px;
        }

        @keyframes burn {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }

        .candle {
            width: 14px;
            height: 40px;
            background: repeating-linear-gradient(45deg, #ff3366, #ff3366 8px, #ffffff 8px, #ffffff 16px);
            border-radius: 4px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2);
            margin-bottom: -5px;
            z-index: 4;
        }

        /* الطبقة العليا مع انحناءات الكريمة */
        .top-layer {
            width: 150px;
            height: 45px;
            background: #ffffff;
            border-radius: 12px 12px 8px 8px;
            position: relative;
            z-index: 3;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.15);
        }

        /* الطبقة الوسطى */
        .middle-layer {
            width: 185px;
            height: 45px;
            background: #fe8793;
            border-radius: 12px 12px 8px 8px;
            margin-top: -8px;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.15);
        }

        /* الطبقة السفلى */
        .bottom-layer {
            width: 210px;
            height: 50px;
            background: #5d2822;
            border-radius: 12px 12px 10px 10px;
            margin-top: -8px;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.3);
        }

        .plate {
            width: 245px;
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-top: -3px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .message {
            font-size: 26px;
            color: #ff6584;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,101,132,0.5);
            margin-top: 10px;
        }

        .hint {
            font-size: 13px;
            color: #a29bfe;
            margin-top: 10px;
            opacity: 0.7;
        }

        /* قصاصات الاحتفال المتطايرة */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: popOut 0.9s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popOut {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body onclick="createConfetti(event)">

    <div class="title">Birthday Celebration</div>

    <div class="cake-container">
        <div class="flame"></div>
        <div class="candle"></div>
        <div class="top-layer"></div>
        <div class="middle-layer"></div>
        <div class="bottom-layer"></div>
        <div class="plate"></div>
    </div>

    <div class="message">Happy Birthday RAYA 🎉</div>
    
    <div class="hint">(Tap anywhere on the screen)</div>

    <script>
        function createConfetti(e) {
            const colors = ['#ff3366', '#ffcc00', '#00ffcc', '#ff6584', '#a29bfe', '#ffffff', '#007bff'];
            
            for (let i = 0; i < 20; i++) {
                let particle = document.createElement('div');
                particle.className = 'confetti';
                
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 90;
                const endX = Math.cos(angle) * distance;
                const endY = Math.sin(angle) * distance;
                
                particle.style.setProperty('--end-x', endX + 'px');
                particle.style.setProperty('--end-y', endY + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 900);
            }
        }
    </script>
</body>
</html>
